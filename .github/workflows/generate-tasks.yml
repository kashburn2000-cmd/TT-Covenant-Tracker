name: Generate Tasks

# Nightly reminder engine for the Tasks & Reminders widget: scans loans
# (maturities, extensions), the covenant tracker (test dates), and — once set
# up — loan_reporting_requirements, upserts tasks into Supabase, and emails a
# digest of anything inside its reminder window via Resend.
#
# Setup:
#   • Run db/tasks_setup.sql once in the Supabase SQL editor.
#   • SUPABASE_KEY repo secret (service_role) — same one the rate pull uses.
#   • Optional email: RESEND_API_KEY repo secret (a credential — keep it here),
#     plus TASK_EMAIL_FROM once a sender domain is verified. Without a key the
#     job still syncs tasks and just logs the would-be digest.
#   • Recipients are normally set on the site: Debt Dashboard → Tasks &
#     Reminders → unlock → ✉ Recipients (settings.taskEmailRecipients). The
#     TASK_EMAIL_TO / TASK_EMAIL_ACCOUNTING_TO secrets below are the fallback
#     for whichever list the site leaves empty.
#   • Accounting ping: the accounting list gets a second digest containing only
#     the lender reporting deliverables, ahead of each deadline.

on:
  schedule:
    # Daily at 11:23 UTC (~6:23am ET) so the digest is waiting at start of
    # day. Off-the-hour minute avoids GitHub's cron congestion.
    - cron: '23 11 * * *'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate tasks and send digest
        env:
          SB_URL: https://ngflppgqohmkkfiljqma.supabase.co
          # Must be the project's SECRET (service_role) key — RLS blocks the
          # publishable key (db/security_setup.sql).
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Fallbacks only — the site's ✉ Recipients panel wins when set.
          TASK_EMAIL_TO: ${{ secrets.TASK_EMAIL_TO }}
          TASK_EMAIL_ACCOUNTING_TO: ${{ secrets.TASK_EMAIL_ACCOUNTING_TO }}
          TASK_EMAIL_FROM: ${{ secrets.TASK_EMAIL_FROM }}
        run: node scripts/generate-tasks.mjs
