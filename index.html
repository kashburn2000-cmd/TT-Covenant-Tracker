<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TT Debt &amp; Capital Markets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ── Theme tokens ───────────────────────────────────────────────
         Dark is the baseline; [data-theme="light"] overrides it.
         Toggled at runtime by setting data-theme on <html>. */
      :root, :root[data-theme="dark"] {
        /* Layered dark-navy surfaces: bg < header < panel < panel3 (elevated).
           panel2 is the inset/recessed surface (inputs, table headers, zebra rows). */
        --bg: #0B1018;
        --header: #0D141E;
        --panel: #121A26;
        --panel2: #0E1520;
        --panel3: #17202E;
        --border: #263244;
        --border2: #344258;          /* strong border / hover border */
        --row-hover: #1B2533;
        --text: #F3F7FB;
        --text2: #C6D1E0;
        --muted: #8B99AF;
        --faint: #5C6B82;
        --faint2: #7A8AA1;
        --faint3: #6B7B93;
        --accent: #5B8AF5;           /* muted institutional blue */
        --accent-strong: #8EAAFF;
        --gold: #D6A84F;             /* Thompson Thrift brand accent — use sparingly */
        --cat-blue: #7EA2C8;         /* categorical: construction / closing */
        --cat-violet: #9DA4CE;       /* categorical: perm-bridge / extension */
        --pass: #4FBF8F;
        --fail: #E06A6A;
        --warn: #D6A84F;
        --disabled: #1A2230;
        --shadow: 0 1px 2px rgba(2,6,12,0.4);
        --ring: color-mix(in srgb, var(--accent) 40%, transparent);
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #F2F4F8;
        --header: #FFFFFF;
        --panel: #FFFFFF;
        --panel2: #F5F7FA;
        --panel3: #FAFBFD;
        --border: #DCE3EC;
        --border2: #C2CCDA;
        --row-hover: #EEF2F8;
        --text: #17202C;
        --text2: #33415A;
        --muted: #64748B;
        --faint: #94A1B5;
        --faint2: #66748B;
        --faint3: #7E8CA3;
        --accent: #2F5EC4;
        --accent-strong: #234FA8;
        --gold: #9C7420;
        --cat-blue: #3D7099;
        --cat-violet: #6470A8;
        --pass: #1E7A4E;
        --fail: #C03B3B;
        --warn: #9C7420;
        --disabled: #E9EDF3;
        --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.05);
        --ring: color-mix(in srgb, var(--accent) 30%, transparent);
        color-scheme: light;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        transition: background-color 0.2s ease;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* Integrated scrollbars */
      * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--border); border-radius: 6px;
        border: 2px solid transparent; background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--border2); background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
      ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
      .spin { display: inline-block; animation: tt-spin 1.1s linear infinite; }
      @keyframes tt-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      /* Apply the saved/system theme before first paint to avoid a flash. */
      (function () {
        try {
          var saved = localStorage.getItem('tt-theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
