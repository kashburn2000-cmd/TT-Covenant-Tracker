<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TT Debt" />
    <title>TT Debt &amp; Capital Markets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#17160f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* ── Theme tokens ───────────────────────────────────────────────
         Warm-neutral "console" palette (design_handoff_debt_suite_restyle).
         Light is the baseline; [data-theme="dark"] overrides it with dark
         equivalents (status hues kept). Toggled at runtime by setting
         data-theme on <html>. */
      :root, :root[data-theme="light"] {
        /* Surfaces: bg (canvas) < panel3 (content pane) < panel/header (cards).
           panel2 is the subtle fill (table headers, chips, selected rows). */
        --bg: #eceae4;
        --header: #ffffff;
        --panel: #ffffff;
        --panel2: #f4f2ec;
        --panel3: #faf9f6;
        --border: rgba(0, 0, 0, 0.08);
        --border2: rgba(0, 0, 0, 0.14);         /* strong border / hover border */
        --row-hover: #f4f2ec;
        --text: #17160f;                        /* ink */
        --text2: #74716a;                       /* secondary */
        --muted: #8a877f;                       /* labels, eyebrows */
        --faint: #b7b4ac;                       /* icons, neutral maturities */
        --faint2: #8a877f;
        --faint3: #94918a;
        --accent: #3a4a6b;                      /* interactive navy */
        --accent-strong: #2c3a56;
        --highlight: #c46410;                   /* under-construction orange */
        --cat-teal: #2f6b45;                    /* categorical: construction / closing */
        --cat-violet: #3a4a6b;                  /* categorical: perm-bridge / extension */
        --pass: #2f6b45;
        --fail: #b23b2e;
        --warn: #a5701f;
        --warn-text: #8a5a1f;                   /* amber text on amber tint */
        --disabled: #eae8e2;
        --shadow: 0 1px 2px rgba(23, 22, 15, 0.05);
        --pop-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        --ring: color-mix(in srgb, var(--accent) 30%, transparent);
        /* Sidebar-on-dark (same in both themes) */
        --sidebar-bg: #17160f;
        --sidebar-active: #ffffff;
        --sidebar-text: #b8b5ad;
        --sidebar-faint: #77746c;
        --font-sans: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #100f0b;
        --header: #1c1a14;
        --panel: #201e17;
        --panel2: #171610;
        --panel3: #1a1812;
        --border: rgba(255, 255, 255, 0.09);
        --border2: rgba(255, 255, 255, 0.17);
        --row-hover: #26241b;
        --text: #f0eee6;
        --text2: #b8b5ad;
        --muted: #8a877f;
        --faint: #5d5a52;
        --faint2: #8a877f;
        --faint3: #78756d;
        --accent: #93a7d1;
        --accent-strong: #aebfe0;
        --highlight: #d98b4a;
        --cat-teal: #5da97c;
        --cat-violet: #93a7d1;
        --pass: #5da97c;
        --fail: #d4695c;
        --warn: #cf9a4d;
        --warn-text: #cf9a4d;
        --disabled: #26241d;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        --pop-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        --ring: color-mix(in srgb, var(--accent) 40%, transparent);
        --sidebar-bg: #0b0a07;
        --sidebar-active: #ffffff;
        --sidebar-text: #b8b5ad;
        --sidebar-faint: #77746c;
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        font-family: var(--font-sans);
        transition: background-color 0.2s ease;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* Integrated scrollbars */
      * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--border); border-radius: 6px;
        border: 2px solid transparent; background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--border2); background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
      ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
      .spin { display: inline-block; animation: tt-spin 1.1s linear infinite; }
      @keyframes tt-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      /* Apply the saved/system theme before first paint to avoid a flash. */
      (function () {
        try {
          var saved = localStorage.getItem('tt-theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
