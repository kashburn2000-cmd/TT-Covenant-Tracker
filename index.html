<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TT Debt &amp; Capital Markets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131418" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ── Theme tokens ───────────────────────────────────────────────
         Dark is the baseline; [data-theme="light"] overrides it.
         Toggled at runtime by setting data-theme on <html>. */
      :root, :root[data-theme="dark"] {
        /* Layered graphite surfaces: bg < header < panel < panel3 (elevated).
           panel2 is the inset/recessed surface (inputs, table headers, zebra rows). */
        --bg: #0E0F13;
        --header: #131418;
        --panel: #17181D;
        --panel2: #111216;
        --panel3: #1C1E24;
        --border: #2A2C34;
        --border2: #3B3E49;          /* strong border / hover border */
        --row-hover: #1F2128;
        --text: #F5F5F7;
        --text2: #CDCED6;
        --muted: #93959F;
        --faint: #63656F;
        --faint2: #81838E;
        --faint3: #71737E;
        --accent: #8478F0;           /* iris violet — primary action/emphasis */
        --accent-strong: #A79DFF;
        --highlight: #D24FA6;        /* orchid — secondary highlight, use sparingly */
        --cat-teal: #2AA898;         /* categorical: construction / closing */
        --cat-violet: #8A7FE6;       /* categorical: perm-bridge / extension */
        --pass: #4FBF8F;
        --fail: #E06A6A;
        --warn: #D6A84F;
        --disabled: #1B1D23;
        --shadow: 0 1px 2px rgba(0,0,0,0.4);
        --ring: color-mix(in srgb, var(--accent) 40%, transparent);
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #F4F4F6;
        --header: #FFFFFF;
        --panel: #FFFFFF;
        --panel2: #F6F6F8;
        --panel3: #FBFBFC;
        --border: #E2E2E8;
        --border2: #C8C8D2;
        --row-hover: #F0F0F4;
        --text: #1A1B20;
        --text2: #3D3F4C;
        --muted: #6E7080;
        --faint: #9B9DAA;
        --faint2: #6F7280;
        --faint3: #85879A;
        --accent: #6552E0;
        --accent-strong: #5040C0;
        --highlight: #B0399B;
        --cat-teal: #00937D;
        --cat-violet: #6E60CC;
        --pass: #1E7A4E;
        --fail: #C03B3B;
        --warn: #9C7420;
        --disabled: #EBEBEF;
        --shadow: 0 1px 2px rgba(20,20,28,0.06), 0 1px 3px rgba(20,20,28,0.05);
        --ring: color-mix(in srgb, var(--accent) 30%, transparent);
        color-scheme: light;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        transition: background-color 0.2s ease;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* Integrated scrollbars */
      * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--border); border-radius: 6px;
        border: 2px solid transparent; background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--border2); background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
      ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
      .spin { display: inline-block; animation: tt-spin 1.1s linear infinite; }
      @keyframes tt-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      /* Apply the saved/system theme before first paint to avoid a flash. */
      (function () {
        try {
          var saved = localStorage.getItem('tt-theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
